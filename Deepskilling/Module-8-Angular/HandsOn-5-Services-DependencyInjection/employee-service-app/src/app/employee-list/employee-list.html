<div class="employee-container">

  <h2>Employee List</h2>

  <p>
    Employee information is retrieved using
    EmployeeService.
  </p>

  <table>

    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Salary</th>
      </tr>
    </thead>

    <tbody>

      @for (employee of employees; track employee.id) {

        <tr>

          <td>
            {{ employee.id }}
          </td>

          <td>
            {{ employee.name }}
          </td>

          <td>
            {{ employee.department }}
          </td>

          <td>
            {{ employee.salary | currency:'INR' }}
          </td>

        </tr>

      }

    </tbody>

  </table>

</div>
